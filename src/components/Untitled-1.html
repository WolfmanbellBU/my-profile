<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar with TailwindCSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Custom Configuration สำหรับสีเฉพาะเจาะจง
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'logrocket-purple': '#764abc',
                    }
                }
            }
        }
    </script>
</head>
<body class="flex flex-col min-h-screen m-0 p-0 font-sans">
    
    <nav class="flex justify-between items-center px-6 md:px-10 py-4 bg-white shadow-sm">
        <div class="flex items-center space-x-2 text-logrocket-purple cursor-pointer">
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M13.13 2.13a1.5 1.5 0 0 0-2.26 0l-4.5 4.5a1.5 1.5 0 0 0-.44 1.06V16.5a1.5 1.5 0 0 0 1.5 1.5h1.5v2.25a1.5 1.5 0 0 0 2.56 1.06l2.44-2.44 2.44 2.44a1.5 1.5 0 0 0 2.56-1.06V18h1.5a1.5 1.5 0 0 0 1.5-1.5V7.69a1.5 1.5 0 0 0-.44-1.06l-4.5-4.5zM12 4.5l3.75 3.75H8.25L12 4.5zM8.25 9.75h7.5v6.75h-7.5V9.75z"/>
            </svg>
            <span class="text-xl font-bold tracking-tight">LogRocket</span>
        </div>

        <div class="hidden md:flex space-x-8 items-center text-sm text-gray-500 font-medium">
            <a href="#" class="hover:text-gray-900 transition duration-150">Features</a>
            <a href="#" class="hover:text-gray-900 transition duration-150">Pricing</a>
            <a href="#" class="hover:text-gray-900 transition duration-150">Customers</a>
            <a href="#" class="hover:text-gray-900 transition duration-150">Blog</a>
            <a href="#" class="text-logrocket-purple hover:text-purple-800 transition duration-150">Sign Up</a>
        </div>
        
        <div class="md:hidden flex items-center">
            <button class="text-gray-500 hover:text-gray-900 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center bg-gradient-to-r from-pink-300 via-purple-300 to-indigo-400 p-4">
        <div class="bg-white w-full max-w-4xl py-20 px-8 md:px-24 rounded shadow-md text-center">
            <h1 class="text-lg md:text-xl font-bold text-gray-800">
                Responsive Navbar with TailwindCSS
            </h1>
        </div>
    </main>

</body>
</html>
